name: Backend foundation CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Keep the security gate independent so an advisory cannot hide build, migration, or DB regressions.
  # Both jobs are required for a green workflow; a failing audit still fails CI.
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Audit production dependencies for high-severity vulnerabilities
        run: |
          # Keep the audit exit code so high/critical advisories fail this job.
          npm audit --omit=dev --audit-level=high --json > npm-audit.json
      - name: Archive dependency audit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-production-npm-audit
          path: npm-audit.json
          if-no-files-found: warn
          retention-days: 14
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: services_test
          POSTGRES_USER: services
          POSTGRES_PASSWORD: services
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U services -d services_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://services:services@127.0.0.1:5432/services_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: TypeScript typecheck (fail fast)
        run: npm run typecheck
      - name: Compile backend (fail fast)
        run: npm run build
      - name: Validate pinned Prisma model
        run: npm run db:validate
      - name: Recompute migration and reject schema/SQL drift
        run: |
          npm run db:baseline:generate
          git diff --exit-code -- prisma/migrations/20261103_initial_platform/migration.sql prisma/migrations/migration_lock.toml
      - name: Apply committed baseline using Prisma Migrate deploy
        run: npm run db:migrate
      - name: Verify migration idempotency and status
        run: |
          npm run db:migrate
          npx prisma migrate status --schema prisma/schema.prisma
      - name: Seed safe, limited geographic starter set twice
        run: |
          npm run db:seed:geo
          npm run db:seed:geo
      - name: Validate geographic seed and PostgreSQL constraint smoke
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT current_database(), current_schema();"
          test "$(psql "$DATABASE_URL" -Atc 'SELECT current_database()')" = services_test
          test "$(psql "$DATABASE_URL" -Atc 'SELECT current_schema()')" = public
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF (SELECT count(*) FROM countries WHERE iso2='KZ') <> 1 OR (SELECT count(*) FROM cities WHERE name IN ('Astana','Almaty','Shymkent')) <> 3 THEN RAISE EXCEPTION 'Geography seed is not idempotent'; END IF; END \$\$;"
          npm run db:smoke
      - name: Verify migrated application tables before integration tests
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          DECLARE missing text;
          BEGIN
            SELECT string_agg(required.table_name, ', ' ORDER BY required.table_name) INTO missing
            FROM unnest(ARRAY[
              'users', 'persons', 'organizations', 'professional_profiles',
              'service_offers', 'service_requests', 'guest_contacts',
              'organization_members', 'sessions',
              'schedule_proposals', 'idempotency_records',
              'busy_blocks', 'cancellation_snapshot_revisions',
              'cancellation_snapshots', 'domain_outbox_events',
              'notification_intents',
              'platform_admin_staff', 'platform_admin_sessions',
              'platform_admin_grants', 'platform_moderation_cases'
            ]) AS required(table_name)
            WHERE to_regclass(format('public.%I', required.table_name)) IS NULL;
            IF missing IS NOT NULL THEN
              RAISE EXCEPTION 'Missing application tables after Prisma migrate: %', missing;
            END IF;
          END $verify$;
          SQL
      - name: Unit and integration tests (after database migrations)
        run: npm test
