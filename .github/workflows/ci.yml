name: Backend foundation CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Keep the security gate independent so an advisory cannot hide build, migration, or DB regressions.
  # Both jobs are required for a green workflow; a failing audit still fails CI.
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Audit production dependencies for high-severity vulnerabilities
        run: |
          # Keep the audit exit code so high/critical advisories fail this job.
          npm audit --omit=dev --audit-level=high --json > npm-audit.json
      - name: Archive dependency audit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-production-npm-audit
          path: npm-audit.json
          if-no-files-found: warn
          retention-days: 14
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: services_test
          POSTGRES_USER: services
          POSTGRES_PASSWORD: services
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U services -d services_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://services:services@127.0.0.1:5432/services_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: TypeScript typecheck (fail fast)
        run: npm run typecheck
      - name: Compile backend (fail fast)
        run: npm run build
      - name: Account and admin session proof regression tests (fail fast)
        run: |
          node --import tsx --test \
            test/session-proof-canonical.test.ts \
            test/admin-session-token.test.ts \
            test/admin-session-token-source-integrity.test.ts
      - name: Validate pinned Prisma model
        run: npm run db:validate
      - name: Recompute migration and reject schema/SQL drift
        run: |
          npm run db:baseline:generate
          git diff --exit-code -- prisma/migrations/20261103_initial_platform/migration.sql prisma/migrations/migration_lock.toml
      - name: Apply committed baseline using Prisma Migrate deploy
        run: npm run db:migrate
      - name: Verify migration idempotency and status
        run: |
          npm run db:migrate
          npx prisma migrate status --schema prisma/schema.prisma
      - name: Seed safe, limited geographic starter set twice
        run: |
          npm run db:seed:geo
          npm run db:seed:geo
      - name: Validate geographic seed and PostgreSQL constraint smoke
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT current_database(), current_schema();"
          test "$(psql "$DATABASE_URL" -Atc 'SELECT current_database()')" = services_test
          test "$(psql "$DATABASE_URL" -Atc 'SELECT current_schema()')" = public
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF (SELECT count(*) FROM countries WHERE iso2='KZ') <> 1 OR (SELECT count(*) FROM cities WHERE name IN ('Astana','Almaty','Shymkent')) <> 3 THEN RAISE EXCEPTION 'Geography seed is not idempotent'; END IF; END \$\$;"
          npm run db:smoke
      - name: Verify migrated application tables before integration tests
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          DECLARE missing text;
          BEGIN
            SELECT string_agg(required.table_name, ', ' ORDER BY required.table_name) INTO missing
            FROM unnest(ARRAY[
              'users', 'persons', 'organizations', 'professional_profiles',
              'service_offers', 'service_requests', 'service_request_events', 'guest_contacts',
              'organization_members', 'sessions',
              'schedule_proposals', 'idempotency_records',
              'busy_blocks', 'cancellation_snapshot_revisions',
              'cancellation_snapshots', 'domain_outbox_events',
              'notification_intents',
              'platform_admin_staff', 'platform_admin_sessions',
              'platform_admin_grants', 'platform_moderation_cases'
            ]) AS required(table_name)
            WHERE to_regclass(format('public.%I', required.table_name)) IS NULL;
            IF missing IS NOT NULL THEN
              RAISE EXCEPTION 'Missing application tables after Prisma migrate: %', missing;
            END IF;
          END $verify$;
          SQL
      - name: Exercise isolated PostgreSQL logical backup and restore
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: services
          PGPASSWORD: services
        run: |
          set -euo pipefail
          umask 077
          backup="$RUNNER_TEMP/services-ci-backup.dump"
          # Unique per workflow attempt, avoiding cross-run cleanup collisions.
          restore_db="services_restore_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          restore_created=0
          cleanup_restore() {
            if [ "$restore_created" -eq 1 ]; then
              dropdb --if-exists "$restore_db" >/dev/null 2>&1 || true
            fi
            rm -f "$backup" "$backup.sha256"
          }
          trap cleanup_restore EXIT
          # Refuse to touch an existing database, including one left by another run.
          # Feed SQL on stdin: psql -c does not expand psql :variables.
          existing_restore="$(psql --dbname=postgres -At -v ON_ERROR_STOP=1 \
            -v target="$restore_db" <<'SQL'
          SELECT 1 FROM pg_database WHERE datname = :'target';
          SQL
          )"
          if [ "$existing_restore" = 1 ]; then
            echo 'Recovery database already exists; refusing destructive cleanup'
            exit 1
          fi
          # A fresh recovery database is essential; never restore into services_test.
          pg_dump --dbname=services_test --format=custom --no-owner --no-acl --file="$backup"
          test -s "$backup"
          # Verify backup bytes before restore and keep checksum evidence in the runner only.
          sha256sum "$backup" > "$backup.sha256"
          sha256sum --check "$backup.sha256"
          pg_restore --list "$backup" >/dev/null
          # Capture exact counts before backup restore. CI is quiescent at this stage.
          source_users="$(psql --dbname=services_test -At -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM public.users')"
          source_cities="$(psql --dbname=services_test -At -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM public.cities')"
          source_migrations="$(psql --dbname=services_test -At -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM public._prisma_migrations')"
          source_constraints="$(psql --dbname=services_test -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM pg_constraint c JOIN pg_namespace n ON n.oid = c.connamespace WHERE n.nspname = 'public'")"
          source_indexes="$(psql --dbname=services_test -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM pg_indexes WHERE schemaname = 'public'")"
          # Compare actual index and constraint definitions, not just totals.
          source_structure_digest="$(psql --dbname=services_test -At -v ON_ERROR_STOP=1 <<'SQL'
          WITH definitions AS (
            SELECT 'constraint:' || c.conrelid::regclass::text || ':' || c.conname AS key,
                   pg_get_constraintdef(c.oid) AS definition
            FROM pg_constraint c
            JOIN pg_namespace n ON n.oid = c.connamespace
            WHERE n.nspname = 'public'
            UNION ALL
            SELECT 'index:' || tablename || ':' || indexname, indexdef
            FROM pg_indexes WHERE schemaname = 'public'
          )
          SELECT md5(coalesce(string_agg(key || '=' || definition, E'\\n' ORDER BY key), ''))
          FROM definitions;
          SQL
          )"
          # Counts alone cannot detect changed or missing rows with the same cardinality.
          # JSON rows include all columns; order by UUID to make the digest deterministic.
          source_geo_digest="$(psql --dbname=services_test -At -v ON_ERROR_STOP=1 -c "SELECT md5(coalesce(string_agg(row_to_json(t)::text, ',' ORDER BY id), '')) FROM (SELECT * FROM public.cities) t")"
          source_migration_digest="$(psql --dbname=services_test -At -v ON_ERROR_STOP=1 -c "SELECT md5(coalesce(string_agg(row_to_json(t)::text, ',' ORDER BY migration_name), '')) FROM (SELECT * FROM public._prisma_migrations) t")"
          # Mark ownership before creation so an interrupted createdb cannot leave
          # an untracked temporary database behind.
          restore_created=1
          createdb "$restore_db"
          pg_restore --dbname="$restore_db" --no-owner --no-acl --single-transaction --exit-on-error "$backup"
          psql --dbname="$restore_db" -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          BEGIN
            IF to_regclass('public.users') IS NULL
               OR to_regclass('public.service_requests') IS NULL
               OR to_regclass('public.notification_intents') IS NULL
               OR to_regclass('public._prisma_migrations') IS NULL
            THEN
              RAISE EXCEPTION 'Recovery database is missing required tables';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM public._prisma_migrations
              WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL
            ) THEN
              RAISE EXCEPTION 'Recovery database has no applied migration';
            END IF;
          END $verify$;
          SQL
          test "$(psql --dbname="$restore_db" -At -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM public.users')" = "$source_users"
          test "$(psql --dbname="$restore_db" -At -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM public.cities')" = "$source_cities"
          test "$(psql --dbname="$restore_db" -At -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM public._prisma_migrations')" = "$source_migrations"
          test "$(psql --dbname="$restore_db" -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM pg_constraint c JOIN pg_namespace n ON n.oid = c.connamespace WHERE n.nspname = 'public'")" = "$source_constraints"
          test "$(psql --dbname="$restore_db" -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM pg_indexes WHERE schemaname = 'public'")" = "$source_indexes"
          restored_structure_digest="$(psql --dbname="$restore_db" -At -v ON_ERROR_STOP=1 <<'SQL'
          WITH definitions AS (
            SELECT 'constraint:' || c.conrelid::regclass::text || ':' || c.conname AS key,
                   pg_get_constraintdef(c.oid) AS definition
            FROM pg_constraint c
            JOIN pg_namespace n ON n.oid = c.connamespace
            WHERE n.nspname = 'public'
            UNION ALL
            SELECT 'index:' || tablename || ':' || indexname, indexdef
            FROM pg_indexes WHERE schemaname = 'public'
          )
          SELECT md5(coalesce(string_agg(key || '=' || definition, E'\\n' ORDER BY key), ''))
          FROM definitions;
          SQL
          )"
          test "$restored_structure_digest" = "$source_structure_digest"
          restored_geo_digest="$(psql --dbname="$restore_db" -At -v ON_ERROR_STOP=1 -c "SELECT md5(coalesce(string_agg(row_to_json(t)::text, ',' ORDER BY id), '')) FROM (SELECT * FROM public.cities) t")"
          test "$restored_geo_digest" = "$source_geo_digest"
          restored_migration_digest="$(psql --dbname="$restore_db" -At -v ON_ERROR_STOP=1 -c "SELECT md5(coalesce(string_agg(row_to_json(t)::text, ',' ORDER BY migration_name), '')) FROM (SELECT * FROM public._prisma_migrations) t")"
          test "$restored_migration_digest" = "$source_migration_digest"
          # Run the same transactional constraint smoke suite against recovered data.
          # The smoke SQL rolls back all its fixture rows.
          restore_url="postgresql://services:services@127.0.0.1:5432/$restore_db"
          DATABASE_URL="$restore_url" npx prisma migrate status --schema prisma/schema.prisma
          DATABASE_URL="$restore_url" npm run db:smoke
          echo 'Isolated logical backup/restore verification passed'
      - name: Verify seller decision input and side-effect boundaries
        run: node --import tsx --test test/seller-decision-input-boundary.test.ts
      - name: Verify seller inbox repository filter boundary
        run: node --import tsx --test test/seller-inbox-repository-filter-boundary.test.ts
      - name: Verify seller notification integrity constraints
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conrelid='public.notification_intents'::regclass
                AND contype='u' AND convalidated
                AND pg_get_constraintdef(oid) LIKE '%dedupe_key%'
            ) AND NOT EXISTS (
              SELECT 1 FROM pg_indexes
              WHERE schemaname='public' AND tablename='notification_intents'
                AND indexdef LIKE 'CREATE UNIQUE INDEX%'
                AND indexdef LIKE '%dedupe_key%'
            ) THEN
              RAISE EXCEPTION 'Missing unique notification dedupe key';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conrelid='public.notification_intents'::regclass
                AND contype='f' AND convalidated
                AND pg_get_constraintdef(oid) LIKE '%domain_event_id%'
                AND pg_get_constraintdef(oid) LIKE '%domain_outbox_events%'
            ) THEN
              RAISE EXCEPTION 'Missing notification-to-outbox foreign key';
            END IF;
          END $verify$;
          SQL
      - name: Verify account session authorization against migrated PostgreSQL
        run: node --import tsx --test test/session-proof-db.test.ts
      - name: Verify seller inbox authorization against migrated PostgreSQL
        run: node --import tsx --test test/seller-inbox-authority-parity-db.test.ts
      - name: Verify admin access foreign keys and unique constraints
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          DECLARE missing text;
          BEGIN
            SELECT string_agg(expected.name, ', ' ORDER BY expected.name) INTO missing
            FROM (VALUES
              ('platform_admin_staff_user_id_fkey'),
              ('platform_admin_sessions_staff_id_fkey'),
              ('platform_admin_grants_staff_id_fkey'),
              ('platform_admin_staff_user_id_key'),
              ('platform_admin_sessions_token_hash_key'),
              ('platform_admin_grants_staff_id_scope_key')
            ) AS expected(name)
            WHERE NOT EXISTS (
              SELECT 1 FROM pg_constraint c
              WHERE c.conname=expected.name
                AND c.convalidated
            ) AND NOT EXISTS (
              SELECT 1 FROM pg_indexes i
              WHERE i.schemaname='public' AND i.indexname=expected.name
                AND expected.name LIKE '%_key'
            );
            IF missing IS NOT NULL THEN
              RAISE EXCEPTION 'Missing or unvalidated admin access constraint: %', missing;
            END IF;
          END $verify$;
          SQL
      - name: Verify moderation and admin role CHECK constraints
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          DECLARE missing text;
          BEGIN
            SELECT string_agg(expected.name, ', ' ORDER BY expected.name) INTO missing
            FROM (VALUES
              ('platform_admin_staff_role_check'),
              ('platform_moderation_cases_subject_kind_check'),
              ('platform_moderation_cases_state_check')
            ) AS expected(name)
            WHERE NOT EXISTS (
              SELECT 1 FROM pg_constraint c
              WHERE c.conname=expected.name
                AND c.contype='c'
                AND c.convalidated
            );
            IF missing IS NOT NULL THEN
              RAISE EXCEPTION 'Missing admin domain CHECK constraints: %', missing;
            END IF;
          END $verify$;
          SQL
      - name: Verify admin proof and scope format constraints
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          DECLARE missing text;
          BEGIN
            SELECT string_agg(expected.name, ', ' ORDER BY expected.name) INTO missing
            FROM (VALUES
              ('platform_admin_sessions_token_hash_format_check'),
              ('platform_admin_grants_scope_format_check'),
              ('platform_moderation_cases_resource_scope_format_check')
            ) AS expected(name)
            WHERE NOT EXISTS (
              SELECT 1 FROM pg_constraint c
              WHERE c.conname=expected.name AND c.contype='c' AND c.convalidated
            );
            IF missing IS NOT NULL THEN
              RAISE EXCEPTION 'Missing admin proof format constraints: %', missing;
            END IF;
          END $verify$;
          SQL
      - name: Verify privileged session lifetime constraints
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          DECLARE missing text;
          BEGIN
            SELECT string_agg(expected.name, ', ' ORDER BY expected.name) INTO missing
            FROM (VALUES
              ('platform_admin_sessions_lifetime_check'),
              ('platform_admin_sessions_mfa_before_expiry_check')
            ) AS expected(name)
            WHERE NOT EXISTS (
              SELECT 1 FROM pg_constraint c
              JOIN pg_class t ON t.oid=c.conrelid
              WHERE c.conname=expected.name AND t.relname='platform_admin_sessions'
                AND c.contype='c' AND c.convalidated
            );
            IF missing IS NOT NULL THEN
              RAISE EXCEPTION 'Missing admin session lifetime constraints: %', missing;
            END IF;
          END $verify$;
          SQL
      - name: Verify moderation queue ordering index
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM pg_indexes
              WHERE schemaname='public'
                AND tablename='platform_moderation_cases'
                AND indexname='platform_moderation_cases_scope_newest_idx'
                AND indexdef LIKE '%resource_scope%'
                AND indexdef LIKE '%created_at DESC%'
                AND indexdef LIKE '%id DESC%'
            ) THEN
              RAISE EXCEPTION 'Missing ordered moderation queue index';
            END IF;
          END $verify$;
          SQL
      - name: Smoke-test default-off privileged logout HTTP endpoint
        run: |
          npm run start > "$RUNNER_TEMP/services-back-smoke.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --fail --connect-timeout 2 --max-time 2 --silent http://127.0.0.1:3001/v1/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo 'Backend health endpoint did not become ready'
            tail -n 150 "$RUNNER_TEMP/services-back-smoke.log" || true
            exit 1
          fi
          status="$(curl --connect-timeout 2 --max-time 5 --silent -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3001/v1/admin/session/logout)"
          test "$status" = 401 || { echo "Unexpected admin logout status: $status"; exit 1; }
          curl --connect-timeout 2 --max-time 5 --silent -D "$RUNNER_TEMP/admin-logout-headers.txt" -o /dev/null -X POST http://127.0.0.1:3001/v1/admin/session/logout
          grep -Eiq '^cache-control:.*no-store' "$RUNNER_TEMP/admin-logout-headers.txt"
          grep -Eiq '^x-content-type-options:.*nosniff' "$RUNNER_TEMP/admin-logout-headers.txt"
          grep -Eiq '^x-robots-tag:.*noindex' "$RUNNER_TEMP/admin-logout-headers.txt"
      - name: Unit and integration tests (after database migrations)
        run: npm test
      - name: Diagnose database state after failed backend checks
        if: failure()
        run: |
          echo '### Backend CI database diagnostics' >> "$GITHUB_STEP_SUMMARY"
          if command -v psql >/dev/null 2>&1; then
            echo 'Database connection and schema:' >> "$GITHUB_STEP_SUMMARY"
            psql "$DATABASE_URL" -At -v ON_ERROR_STOP=1 -c               "SELECT current_database(), current_schema(), to_regclass('public.users'), to_regclass('public.platform_admin_sessions');"               >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          fi
          if [ -f "$RUNNER_TEMP/services-back-smoke.log" ]; then
            echo '=== Backend smoke log (last 100 lines) ==='
            tail -n 100 "$RUNNER_TEMP/services-back-smoke.log"
          fi
          echo '=== Prisma migration status ==='
          npx prisma migrate status --schema prisma/schema.prisma || true
